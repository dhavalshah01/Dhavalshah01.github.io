<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ccEnd" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0078d4"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#f8f9fa" rx="12"/>

  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a2e">Infrastructure as Code &amp; Promotion Across Environments</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#555">One set of Bicep modules, parameterized per environment, promoted through gated pipelines</text>
  <line x1="60" y1="72" x2="840" y2="72" stroke="#dee2e6" stroke-width="1.5"/>

  <!-- ===== Tier 1: source → CI ===== -->
  <rect x="36" y="100" width="150" height="86" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="111" y="136" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Developer</text>
  <text x="111" y="156" text-anchor="middle" font-size="8.6" fill="#555">commits Bicep + PR</text>

  <line x1="186" y1="143" x2="220" y2="143" stroke="#0078d4" stroke-width="2.2" marker-end="url(#ccEnd)"/>

  <rect x="222" y="100" width="196" height="86" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="320" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Git Repository</text>
  <text x="320" y="151" text-anchor="middle" font-size="8.4" fill="#555">modules · param files · pipelines</text>
  <text x="320" y="166" text-anchor="middle" font-size="8" font-style="italic" fill="#94a3b8">hub · spokes · ai · gateway · monitor</text>

  <line x1="418" y1="143" x2="452" y2="143" stroke="#0078d4" stroke-width="2.2" marker-end="url(#ccEnd)"/>

  <rect x="454" y="100" width="208" height="86" rx="10" fill="#f3eefc" stroke="#8661c5" stroke-width="1.5"/>
  <text x="558" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">CI — Validate</text>
  <text x="558" y="151" text-anchor="middle" font-size="8.4" fill="#555">what-if · lint · policy (PSRule)</text>
  <text x="558" y="166" text-anchor="middle" font-size="8" font-style="italic" fill="#94a3b8">preview every change before apply</text>

  <line x1="662" y1="143" x2="696" y2="143" stroke="#0078d4" stroke-width="2.2" marker-end="url(#ccEnd)"/>

  <rect x="698" y="100" width="166" height="86" rx="10" fill="#ffffff" stroke="#107c10" stroke-width="1.5"/>
  <text x="781" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Entra Workload ID</text>
  <text x="781" y="151" text-anchor="middle" font-size="8.4" fill="#555">OIDC federated login</text>
  <text x="781" y="166" text-anchor="middle" font-size="8" font-weight="700" fill="#107c10">no secrets in pipeline</text>

  <!-- connector down to pipeline -->
  <path d="M558 186 C558 230, 155 224, 155 264" fill="none" stroke="#0078d4" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#ccEnd)"/>
  <text x="360" y="232" text-anchor="middle" font-size="8.8" font-weight="700" fill="#0078d4">az deployment (what-if → create)</text>

  <!-- ===== Tier 2: dev → staging → prod ===== -->
  <!-- Dev -->
  <rect x="60" y="266" width="190" height="106" rx="11" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.5"/>
  <circle cx="155" cy="294" r="13" fill="#0078d4"/><text x="155" y="299" text-anchor="middle" font-size="12" fill="#fff">1</text>
  <text x="155" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Dev</text>
  <text x="155" y="342" text-anchor="middle" font-size="8.6" font-family="JetBrains Mono, monospace" fill="#555">rg-ai-hub-dev</text>
  <text x="155" y="359" text-anchor="middle" font-size="8.8" fill="#555">fast iteration</text>

  <!-- gate 1 -->
  <line x1="250" y1="319" x2="322" y2="319" stroke="#0078d4" stroke-width="2.2" marker-end="url(#ccEnd)"/>
  <text x="286" y="304" text-anchor="middle" font-size="9">🔒</text>
  <text x="286" y="340" text-anchor="middle" font-size="8" font-weight="700" fill="#0078d4">PR review</text>

  <!-- Staging -->
  <rect x="360" y="266" width="190" height="106" rx="11" fill="#f3eefc" stroke="#8661c5" stroke-width="1.5"/>
  <circle cx="455" cy="294" r="13" fill="#8661c5"/><text x="455" y="299" text-anchor="middle" font-size="12" fill="#fff">2</text>
  <text x="455" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Staging</text>
  <text x="455" y="342" text-anchor="middle" font-size="8.6" font-family="JetBrains Mono, monospace" fill="#555">rg-ai-hub-stg</text>
  <text x="455" y="359" text-anchor="middle" font-size="8.8" fill="#555">integration + eval gates</text>

  <!-- gate 2 -->
  <line x1="550" y1="319" x2="622" y2="319" stroke="#0078d4" stroke-width="2.2" marker-end="url(#ccEnd)"/>
  <text x="586" y="304" text-anchor="middle" font-size="9">🔒</text>
  <text x="586" y="340" text-anchor="middle" font-size="8" font-weight="700" fill="#0078d4">manual approval</text>

  <!-- Prod -->
  <rect x="660" y="266" width="190" height="106" rx="11" fill="#eafaef" stroke="#107c10" stroke-width="1.5"/>
  <circle cx="755" cy="294" r="13" fill="#107c10"/><text x="755" y="299" text-anchor="middle" font-size="12" fill="#fff">3</text>
  <text x="755" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Production</text>
  <text x="755" y="342" text-anchor="middle" font-size="8.6" font-family="JetBrains Mono, monospace" fill="#555">rg-ai-hub-prod</text>
  <text x="755" y="359" text-anchor="middle" font-size="8.8" fill="#555">change-controlled</text>

  <!-- bottom info -->
  <rect x="40" y="396" width="820" height="62" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="450" y="420" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0078d4">Same modules, different parameters</text>
  <text x="450" y="439" text-anchor="middle" font-size="9.2" fill="#555">what-if previews drift before apply · approvals gate the path to prod · the repo is the single source of truth, so click-ops drift disappears</text>
</svg>
