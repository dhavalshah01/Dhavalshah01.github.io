<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="haEnd" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0078d4"/>
    </marker>
    <marker id="haStart" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 Z" fill="#0078d4"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a2e">Centralized Hub AI Pattern</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#555">Shared AI services in a governed hub — application spokes consume them privately</text>
  <line x1="60" y1="72" x2="840" y2="72" stroke="#dee2e6" stroke-width="1.5"/>

  <!-- ===== Spokes (left) ===== -->
  <g>
    <rect x="28" y="98" width="170" height="74" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
    <text x="113" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">App Spoke 1</text>
    <text x="113" y="140" text-anchor="middle" font-size="9.5" fill="#555">App Service · AKS · APIs</text>
    <text x="113" y="159" text-anchor="middle" font-size="9" font-weight="600" fill="#0078d4">Private Endpoint</text>

    <rect x="28" y="192" width="170" height="74" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
    <text x="113" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">App Spoke 2</text>
    <text x="113" y="234" text-anchor="middle" font-size="9.5" fill="#555">App Service · AKS · APIs</text>
    <text x="113" y="253" text-anchor="middle" font-size="9" font-weight="600" fill="#0078d4">Private Endpoint</text>

    <rect x="28" y="286" width="170" height="74" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
    <text x="113" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">App Spoke N</text>
    <text x="113" y="328" text-anchor="middle" font-size="9.5" fill="#555">App Service · AKS · APIs</text>
    <text x="113" y="347" text-anchor="middle" font-size="9" font-weight="600" fill="#0078d4">Private Endpoint</text>
  </g>

  <!-- Peering connectors -->
  <g stroke="#0078d4" stroke-width="2" marker-end="url(#haEnd)" marker-start="url(#haStart)">
    <line x1="200" y1="135" x2="248" y2="160"/>
    <line x1="200" y1="229" x2="248" y2="220"/>
    <line x1="200" y1="323" x2="248" y2="280"/>
  </g>
  <text x="224" y="120" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0078d4">VNet Peering</text>

  <!-- ===== Hub container ===== -->
  <rect x="250" y="92" width="620" height="300" rx="12" fill="#eef5fc" stroke="#0078d4" stroke-width="2"/>
  <text x="560" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#005a9e" letter-spacing="0.5">HUB VNET · PLATFORM LANDING ZONE</text>

  <!-- AI Gateway column -->
  <rect x="268" y="126" width="112" height="202" rx="9" fill="#ede9fe" stroke="#8661c5" stroke-width="1.5"/>
  <text x="324" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">AI Gateway</text>
  <text x="324" y="224" text-anchor="middle" font-size="10" fill="#6d28d9">(APIM)</text>
  <text x="324" y="250" text-anchor="middle" font-size="8.5" fill="#7c5bc0">rate limit ·</text>
  <text x="324" y="263" text-anchor="middle" font-size="8.5" fill="#7c5bc0">cache · route ·</text>
  <text x="324" y="276" text-anchor="middle" font-size="8.5" fill="#7c5bc0">token metrics</text>

  <!-- arrow gateway -> services -->
  <line x1="380" y1="200" x2="390" y2="200" stroke="#8661c5" stroke-width="2" marker-end="url(#haEnd)"/>

  <!-- Service cards -->
  <g>
    <!-- row 1 -->
    <rect x="392" y="126" width="148" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="392" y="126" width="148" height="4" rx="2" fill="#0078d4"/>
    <text x="466" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Azure OpenAI</text>
    <text x="466" y="184" text-anchor="middle" font-size="8.8" fill="#555">GPT-4o + Embeddings</text>

    <rect x="551" y="126" width="148" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="551" y="126" width="148" height="4" rx="2" fill="#00b4d8"/>
    <text x="625" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Azure AI Search</text>
    <text x="625" y="184" text-anchor="middle" font-size="8.8" fill="#555">Vector + Semantic (RAG)</text>

    <rect x="710" y="126" width="148" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="710" y="126" width="148" height="4" rx="2" fill="#107c10"/>
    <text x="784" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Data Lake</text>
    <text x="784" y="184" text-anchor="middle" font-size="8.8" fill="#555">ADLS Gen2</text>

    <!-- row 2 -->
    <rect x="392" y="232" width="148" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="392" y="232" width="148" height="4" rx="2" fill="#d4a017"/>
    <text x="466" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Key Vault</text>
    <text x="466" y="290" text-anchor="middle" font-size="8.8" fill="#555">Secrets · RBAC</text>

    <rect x="551" y="232" width="148" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="551" y="232" width="148" height="4" rx="2" fill="#8661c5"/>
    <text x="625" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Monitor</text>
    <text x="625" y="290" text-anchor="middle" font-size="8.8" fill="#555">App Insights · Logs</text>

    <rect x="710" y="232" width="148" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="710" y="232" width="148" height="4" rx="2" fill="#e07000"/>
    <text x="784" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Model Registry</text>
    <text x="784" y="290" text-anchor="middle" font-size="8.8" fill="#555">Azure ML</text>
  </g>

  <!-- Governance strip -->
  <rect x="268" y="346" width="590" height="32" rx="8" fill="#0f172a"/>
  <text x="563" y="367" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">Managed Identity · RBAC (least privilege) · Private Endpoints · Policy &amp; Cost Guardrails</text>

  <!-- ===== Business value strip ===== -->
  <rect x="28" y="410" width="844" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="450" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#0078d4">Business Value</text>

  <g>
    <circle cx="112" cy="462" r="11" fill="#deecf9"/><text x="112" y="466" text-anchor="middle" font-size="11">🤝</text>
    <text x="112" y="492" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Shared Models</text>
    <text x="112" y="508" text-anchor="middle" font-size="8.3" fill="#666">One governed set of</text>
    <text x="112" y="519" text-anchor="middle" font-size="8.3" fill="#666">models for all teams</text>

    <circle cx="280" cy="462" r="11" fill="#deecf9"/><text x="280" y="466" text-anchor="middle" font-size="11">🛡️</text>
    <text x="280" y="492" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Central Governance</text>
    <text x="280" y="508" text-anchor="middle" font-size="8.3" fill="#666">Uniform security and</text>
    <text x="280" y="519" text-anchor="middle" font-size="8.3" fill="#666">policy across spokes</text>

    <circle cx="448" cy="462" r="11" fill="#deecf9"/><text x="448" y="466" text-anchor="middle" font-size="11">💲</text>
    <text x="448" y="492" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Cost-Efficient Reuse</text>
    <text x="448" y="508" text-anchor="middle" font-size="8.3" fill="#666">Amortize quota and</text>
    <text x="448" y="519" text-anchor="middle" font-size="8.3" fill="#666">caching across apps</text>

    <circle cx="616" cy="462" r="11" fill="#deecf9"/><text x="616" y="466" text-anchor="middle" font-size="11">🔒</text>
    <text x="616" y="492" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Private Access</text>
    <text x="616" y="508" text-anchor="middle" font-size="8.3" fill="#666">Traffic stays on the</text>
    <text x="616" y="519" text-anchor="middle" font-size="8.3" fill="#666">Microsoft backbone</text>

    <circle cx="784" cy="462" r="11" fill="#deecf9"/><text x="784" y="466" text-anchor="middle" font-size="11">📈</text>
    <text x="784" y="492" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Observability</text>
    <text x="784" y="508" text-anchor="middle" font-size="8.3" fill="#666">End-to-end usage,</text>
    <text x="784" y="519" text-anchor="middle" font-size="8.3" fill="#666">latency &amp; cost insight</text>
  </g>
</svg>
