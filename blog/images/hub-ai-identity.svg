<svg width="900" height="512" viewBox="0 0 900 512" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="idEnd" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0078d4"/>
    </marker>
    <marker id="idGray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="512" fill="#f8f9fa" rx="12"/>

  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a2e">Identity &amp; Access — Managed Identity + RBAC, No Keys</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#555">Every hop is an Entra identity with a least-privilege role — nothing is a shared secret</text>
  <line x1="60" y1="72" x2="840" y2="72" stroke="#dee2e6" stroke-width="1.5"/>

  <!-- Entra banner -->
  <rect x="300" y="84" width="300" height="40" rx="20" fill="#0f172a"/>
  <text x="450" y="109" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e2e8f0">Microsoft Entra ID — token issuer (no shared secrets)</text>
  <line x1="380" y1="124" x2="170" y2="154" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#idGray)"/>
  <line x1="470" y1="124" x2="400" y2="154" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#idGray)"/>

  <!-- ===== Identity chain ===== -->
  <!-- Spoke -->
  <rect x="40" y="156" width="200" height="104" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="140" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">App Spoke</text>
  <rect x="58" y="198" width="164" height="26" rx="13" fill="#deecf9"/>
  <text x="140" y="215" text-anchor="middle" font-size="8.4" font-weight="600" fill="#005a9e">User-Assigned Managed Identity</text>
  <text x="140" y="244" text-anchor="middle" font-size="8.6" font-style="italic" fill="#64748b">no keys stored in config</text>

  <line x1="240" y1="208" x2="298" y2="208" stroke="#0078d4" stroke-width="2.2" marker-end="url(#idEnd)"/>
  <text x="269" y="198" text-anchor="middle" font-size="8" font-weight="700" fill="#0078d4">① token</text>

  <!-- APIM -->
  <rect x="300" y="156" width="200" height="104" rx="10" fill="#f3eefc" stroke="#8661c5" stroke-width="1.5"/>
  <text x="400" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">API Management</text>
  <rect x="318" y="198" width="164" height="26" rx="13" fill="#ede9fe"/>
  <text x="400" y="215" text-anchor="middle" font-size="8.4" font-weight="600" fill="#6d28d9">System-Assigned Managed Identity</text>
  <text x="400" y="244" text-anchor="middle" font-size="8.6" font-style="italic" fill="#64748b">validates the caller</text>

  <line x1="500" y1="208" x2="558" y2="208" stroke="#0078d4" stroke-width="2.2" marker-end="url(#idEnd)"/>
  <text x="529" y="198" text-anchor="middle" font-size="8" font-weight="700" fill="#0078d4">② MI auth</text>

  <!-- OpenAI -->
  <rect x="560" y="156" width="200" height="104" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="660" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Azure OpenAI</text>
  <rect x="576" y="198" width="168" height="26" rx="13" fill="#eafaef"/>
  <text x="660" y="215" text-anchor="middle" font-size="8" font-weight="600" fill="#107c10">Cognitive Services OpenAI User</text>
  <text x="660" y="244" text-anchor="middle" font-size="8.6" font-weight="700" fill="#c50f1f">local auth DISABLED</text>

  <!-- fan to data services -->
  <text x="450" y="296" text-anchor="middle" font-size="10" font-weight="600" fill="#555">The same identities carry least-privilege roles into the data plane:</text>
  <g stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="380" y1="262" x2="170" y2="314" marker-end="url(#idGray)"/>
    <line x1="420" y1="262" x2="450" y2="314" marker-end="url(#idGray)"/>
    <line x1="460" y1="262" x2="730" y2="314" marker-end="url(#idGray)"/>
  </g>

  <!-- Key Vault -->
  <rect x="40" y="316" width="240" height="106" rx="10" fill="#ffffff" stroke="#d4a017" stroke-width="1.5"/>
  <text x="160" y="342" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Azure Key Vault</text>
  <rect x="56" y="354" width="208" height="24" rx="12" fill="#fff8e6"/>
  <text x="160" y="370" text-anchor="middle" font-size="8.4" font-weight="600" fill="#9a6700">role: Key Vault Secrets User</text>
  <text x="160" y="394" text-anchor="middle" font-size="8.6" fill="#555">RBAC · no access policies</text>
  <text x="160" y="409" text-anchor="middle" font-size="8.6" fill="#555">purge protection on</text>

  <!-- AI Search -->
  <rect x="330" y="316" width="240" height="106" rx="10" fill="#ffffff" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="450" y="342" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Azure AI Search</text>
  <rect x="346" y="354" width="208" height="24" rx="12" fill="#e6f7fb"/>
  <text x="450" y="370" text-anchor="middle" font-size="8.3" font-weight="600" fill="#0078d4">role: Search Index Data Reader</text>
  <text x="450" y="394" text-anchor="middle" font-size="8.6" fill="#555">API keys disabled</text>
  <text x="450" y="409" text-anchor="middle" font-size="8.6" fill="#555">per-spoke index scope</text>

  <!-- Storage -->
  <rect x="620" y="316" width="240" height="106" rx="10" fill="#ffffff" stroke="#107c10" stroke-width="1.5"/>
  <text x="740" y="342" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">ADLS Gen2</text>
  <rect x="636" y="354" width="208" height="24" rx="12" fill="#eafaef"/>
  <text x="740" y="370" text-anchor="middle" font-size="8.3" font-weight="600" fill="#107c10">role: Storage Blob Data Reader</text>
  <text x="740" y="394" text-anchor="middle" font-size="8.6" fill="#555">per-spoke container scope</text>
  <text x="740" y="409" text-anchor="middle" font-size="8.6" fill="#555">no account keys</text>

  <!-- bottom emphasis -->
  <rect x="40" y="442" width="820" height="46" rx="10" fill="#eafaef" stroke="#107c10"/>
  <text x="450" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#107c10">No keys or connection strings in application code — every call is an auditable Entra identity</text>
</svg>
